    <script>
      /* Thème appliqué avant le rendu pour éviter tout flash.
         Nuit = 19h00 → 06h30 (noir), le reste du temps (blanc). */
      (function () {
        try {
          var m = localStorage.getItem("doxa.theme.v1") || "auto";
          var h = new Date().getHours() + new Date().getMinutes() / 60;
          var night = h >= 19 || h < 6.5;
          var t = m === "day" ? "light" : m === "night" ? "dark" : night ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
